<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplicateur Décimal Géant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin: 10px 0;
        }
        input {
            flex: 1;
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #28a745;
            outline: none;
        }
        button.icon-btn {
            flex: 0 0 auto;
            padding: 0 14px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background-color: #f8f9fa;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }
        button.icon-btn:hover {
            background-color: #e9ecef;
            border-color: #28a745;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            color: #495057;
            word-wrap: break-word;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
        }
        .rounded-box {
            margin-top: 12px;
            padding: 15px;
            background-color: #fff3cd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            text-align: left;
        }
        .rounded-box .label {
            font-size: 14px;
            color: #6c5400;
        }
        .rounded-box .valeur {
            font-size: 18px;
            font-weight: bold;
            color: #495057;
            word-wrap: break-word;
            flex: 1;
        }
        .copy-btn {
            flex: 0 0 auto;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background-color: #28a745;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .copy-btn:hover {
            background-color: #218838;
        }
        .copy-btn.copied {
            background-color: #17a2b8;
        }
        .feedback {
            font-size: 12px;
            color: #28a745;
            min-height: 16px;
            margin-top: 4px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Multiplication Immense (Entiers & Décimaux)</h2>

    <div class="input-row">
        <input type="text" id="num1" placeholder="Premier nombre (ex: 123.456...)" oninput="calculer()">
        <button class="icon-btn" type="button" title="Coller dans ce champ" onclick="collerDans('num1')">📋</button>
    </div>
    <div class="input-row">
        <input type="text" id="num2" placeholder="Deuxième nombre (ex: 0.0000123...)" oninput="calculer()">
        <button class="icon-btn" type="button" title="Coller dans ce champ" onclick="collerDans('num2')">📋</button>
    </div>
    <div class="feedback" id="feedbackColler"></div>

    <div class="result-box" id="resultat">
        Résultat : 0
    </div>

    <div class="rounded-box">
        <div class="label">Arrondi à la centaine inférieure :</div>
        <div class="valeur" id="resultatArrondi">0</div>
        <button class="copy-btn" id="btnCopier" type="button" onclick="copierArrondi()">Copier</button>
    </div>
    <div class="feedback" id="feedbackCopier"></div>
</div>

<script>
function multiplierDecimaux(str1, str2) {
    // Remplacer la virgule par un point au cas où
    str1 = str1.replace(',', '.');
    str2 = str2.replace(',', '.');

    // Nettoyer les espaces inutiles
    str1 = str1.trim();
    str2 = str2.trim();

    // Vérification basique du format numérique
    const validRegex = /^-?\d*(\.\d+)?$/;
    if (!validRegex.test(str1) || !validRegex.test(str2) || str1 === '.' || str2 === '.') {
        throw new Error("Format invalide");
    }

    // Déterminer le signe final
    let negatif = false;
    if (str1.startsWith('-')) { negatif = !negatif; str1 = str1.slice(1); }
    if (str2.startsWith('-')) { negatif = !negatif; str2 = str2.slice(1); }

    // Trouver la position de la virgule pour compter les décimales
    const p1 = str1.indexOf('.');
    const p2 = str2.indexOf('.');

    const dec1 = p1 === -1 ? 0 : str1.length - p1 - 1;
    const dec2 = p2 === -1 ? 0 : str2.length - p2 - 1;

    const totalDecimales = dec1 + dec2;

    // Supprimer les points pour obtenir de grands entiers
    const propre1 = str1.replace('.', '');
    const propre2 = str2.replace('.', '');

    // Si les chaînes sont vides après nettoyage (ex: input vide)
    if (!propre1 || !propre2) return "0";

    // Multiplication précise avec BigInt
    const b1 = BigInt(propre1);
    const b2 = BigInt(propre2);
    let rBig = b1 * b2;

    if (rBig === 0n) return "0";

    let rStr = rBig.toString();

    // Replacer la virgule au bon endroit
    if (totalDecimales > 0) {
        // Ajouter des zéros au début si le nombre de chiffres est plus petit que les décimales requises
        if (rStr.length <= totalDecimales) {
            rStr = rStr.padStart(totalDecimales + 1, '0');
        }
        const posVirgule = rStr.length - totalDecimales;
        rStr = rStr.slice(0, posVirgule) + '.' + rStr.slice(posVirgule);

        // Nettoyer les zéros inutiles à la fin après la virgule
        rStr = rStr.replace(/\.?0+$/, '');
    }

    return (negatif ? "-" : "") + (rStr === "" ? "0" : rStr);
}

// Arrondit une chaîne numérique (entier ou décimal, potentiellement négative et très grande)
// à la centaine inférieure (multiple de 100 le plus proche, vers le bas / -infini),
// en calcul exact via BigInt (aucune perte de précision même sur des nombres géants).
function arrondiCentaineInferieure(resStr) {
    let s = resStr.trim();
    let negatif = false;
    if (s.startsWith('-')) {
        negatif = true;
        s = s.slice(1);
    }

    let intPart = s;
    let fracPart = '';
    const pointIndex = s.indexOf('.');
    if (pointIndex !== -1) {
        intPart = s.slice(0, pointIndex);
        fracPart = s.slice(pointIndex + 1);
    }
    if (intPart === '') intPart = '0';

    const numerateurStr = (negatif ? '-' : '') + intPart + fracPart;
    const numerateur = BigInt(numerateurStr);
    const denominateur = 100n * (10n ** BigInt(fracPart.length));

    let quotient = numerateur / denominateur;
    const reste = numerateur % denominateur;

    // BigInt tronque vers zéro : on corrige pour obtenir un vrai arrondi vers le bas (floor)
    if (reste !== 0n && numerateur < 0n) {
        quotient -= 1n;
    }

    const arrondi = quotient * 100n;
    return arrondi.toString();
}

function calculer() {
    const val1 = document.getElementById('num1').value;
    const val2 = document.getElementById('num2').value;
    const divResultat = document.getElementById('resultat');
    const divArrondi = document.getElementById('resultatArrondi');

    if (val1.trim() === "" || val2.trim() === "") {
        divResultat.innerText = "Résultat : 0";
        divArrondi.innerText = "0";
        return;
    }

    try {
        const res = multiplierDecimaux(val1, val2);
        divResultat.innerText = "Résultat : " + res;
        divArrondi.innerText = arrondiCentaineInferieure(res);
    } catch (error) {
        divResultat.innerText = "Veuillez entrer des nombres valides (ex: 1234.56).";
        divArrondi.innerText = "-";
    }
}

async function collerDans(idChamp) {
    const feedback = document.getElementById('feedbackColler');
    try {
        const texte = await navigator.clipboard.readText();
        document.getElementById(idChamp).value = texte.trim();
        calculer();
        feedback.textContent = "Valeur collée dans le champ.";
        setTimeout(() => { feedback.textContent = ""; }, 2000);
    } catch (err) {
        feedback.textContent = "Impossible d'accéder au presse-papiers (autorisation refusée).";
        setTimeout(() => { feedback.textContent = ""; }, 3000);
    }
}

async function copierArrondi() {
    const feedback = document.getElementById('feedbackCopier');
    const btn = document.getElementById('btnCopier');
    const valeur = document.getElementById('resultatArrondi').innerText;
    try {
        await navigator.clipboard.writeText(valeur);
        btn.textContent = "Copié !";
        btn.classList.add('copied');
        feedback.textContent = "";
        setTimeout(() => {
            btn.textContent = "Copier";
            btn.classList.remove('copied');
        }, 1500);
    } catch (err) {
        feedback.textContent = "Impossible de copier automatiquement, copiez manuellement la valeur.";
        setTimeout(() => { feedback.textContent = ""; }, 3000);
    }
}
</script>

</body>
</html>
